<!-- CSS crítico: pinta o cabeçalho e o herói antes da folha completa -->
<style>
:root{--color-abismo:#07272E;--color-mare:#0F4C5C;--color-sal:#FAFCFB;--color-sal-2:#EDF2F0;--color-sal-3:#DDE6E3;--color-areia:#E3D2AE;--color-salmoura:#C2566B;--color-tinta:#0B1A1E;--font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--font-body:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-data:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--color-tinta);background:var(--color-sal);line-height:1.62;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
.topbar{background:var(--color-abismo);color:#A9C4C9;font-size:.78rem;font-family:var(--font-data)}
.site-header{position:sticky;top:0;z-index:80;background:#fff;border-bottom:1px solid var(--color-sal-3)}
.wrap-wide{width:min(100% - clamp(1rem,4vw,3rem)*2,1440px);margin-inline:auto}
.header__inner{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding-block:.75rem}
.brand{display:inline-flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit}
.brand__mark{inline-size:46px;block-size:46px;flex:none}
.brand__name{font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.05;letter-spacing:-.022em}
.brand__sub{font-family:var(--font-data);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#40565C}
.hero{background:var(--color-abismo);color:var(--color-sal)}
.skip-link{position:absolute;left:1rem;top:-100px;z-index:200;background:var(--color-abismo);color:var(--color-sal);padding:.75rem 1.5rem;border-radius:4px}
.skip-link:focus{top:1rem}
[hidden]{display:none!important}
</style>
